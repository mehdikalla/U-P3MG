# ==============================================================================
# Fichier de configuration principal (config.yaml)
# ==============================================================================

# --- 1. Paramètres généraux et stratégie ---
model: "hq"               # Choix de l'architecture : 'p3mg', 'ista', 'hq', 'pmms', 'pd'
strategy: "random_search"       # Stratégie de résolution : 'unrolling' ou 'random_search'
seed: 42                    # Graine aléatoire pour la reproductibilité

# --- 2. Chemins et données ---
dataset_dir: "./Dataset"
data_folder: "data_1"       # Sous-dossier de génération à utiliser (ex: data_0, data_1, ...)
train: "train.pt"

val: "val.pt"
test: "test.pt"
save_dir: "./Results"

# --- 3. Paramètres d'entraînement (Unrolling) ---
epochs: 50                 # Nombre total d'époques
lr: 9.0e-3               # Taux d'apprentissage (Learning Rate)
batch_size: 10             # Taille des batchs globale (utilisée par le Dataloader générique)
train_batch_size: 10       # Taille des batchs pour l'entraînement
val_batch_size: 1          # Taille des batchs pour la validation
test_batch_size: 1         # Taille des batchs pour le test
criterion: "MSE"           # Métrique d'évaluation ('MSE', 'SNR', 'TSNR')
Loss: "MSE"                # Fonction de coût principale

# --- 4. Architecture du réseau ---
num_layers: 30             # Nombre de couches déroulées (K) pour tous les modèles
num_pd_layers: 10          # Nombre de sous-couches Primal-Dual (T) (utilisé par P3MG et HQ)
number_layers: 30         # Rétrocompatibilité avec l'ancien formalisme
number_pd_layers: 10       # Rétrocompatibilité avec l'ancien formalisme

# --- 5. Paramètres statiques (Spécifiques aux modèles) ---
# Communs (P3MG / PMMS)
alpha: 1.0e-05
beta: 1.0e-05
eta: 0.01
# Spécifiques à PMMS
sigma: 1.0e-05              # Paramètre de lissage SOOT (doit être égal à alpha, cf. runPMMSalgorithm.m)
nu: 8.0e-5                    # Poids de régularisation ~lambda
# Spécifiques à HQ
delta_cvx: 0.01            # Paramètre de lissage pour la pénalité convexe
delta_ncvx: 0.01           # Paramètre de lissage pour la pénalité non-convexe

# --- 6. Paramètres algorithmiques (Random Search / Oracle) ---
n_trials: 100          # Nombre de tirages d'hyperparametres a tester (calibration)
algo_iters: 1000            # Nombre d'itérations pour l'algorithme itératif standard
lmbd_min: 1.0e-9             # Borne inférieure pour la recherche de Lambda (P3MG, HQ)
lmbd_max: 1.1              # Borne supérieure pour la recherche de Lambda (P3MG, HQ)
lmbd_ist_min: 1.0e-9         # Borne inférieure pour la recherche de Lambda ISTA (indépendante de P3MG)
lmbd_ist_max: 1.1          # Borne supérieure pour la recherche de Lambda ISTA (indépendante de P3MG)

tau_min: 0.01              # Borne inférieure pour la recherche de Tau (P3MG, PD)
tau_max: 2.0               # Borne supérieure pour la recherche de Tau (P3MG, PD)
nu_min: 1.0e-9              # Borne inférieure pour la recherche de nu (PMMS uniquement)
nu_max: 1.1              # Borne supérieure pour la recherche de nu (PMMS uniquement)

# --- 7. Sauvegarde et chargement ---

checkpoint: null           # Chemin vers un poids spécifique (ex: "./Results/best_model.pt")
resume: null               # Rétrocompatibilité pour la reprise d'entraînement 

